[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mokit"
version = "0.1.0"
description = "MOKIT: Model Optimization Kit for Inference and Training"
readme = "README.md"
requires-python = ">=3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Shuyang Cao", email = "shuyang.cao@outlook.com" },
]
keywords = [
    "model optimization",
    "inference",
    "training",
    "pytorch",
    "deep learning",
    "machine learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# PyPI name is `torch`, not `pytorch`. Linux wheels are already CUDA builds;
# `--index-url https://download.pytorch.org/whl/cpu` for CPU-only.
dependencies = [
    "torch>=2.14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pre-commit>=4",
    # Pinned exactly: the pre-commit hooks run these from this environment.
    "pre-commit-hooks==6.0.0",
    "reuse==6.2.0",
    "ruff==0.16.7",
    "pyrefly==1.3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["mokit"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
# D203 conflicts with `ruff format`; D212 is the partner of D213, which this keeps.
ignore = ["D203", "D212"]

[tool.pyrefly]
# Read by the pyrefly pre-commit hook at both commit and push.
preset = "default"

[tool.pyrefly.errors]
implicit-any-parameter = true
unannotated-return = true

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
# Lets the tests import the package from the repo root without installing it first.
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]

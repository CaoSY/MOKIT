# Hooks run in the active dev environment (`language: system`), not isolated
# pre-commit envs. Tool versions are pinned only in pyproject.toml's dev group.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      # LICENSES/ holds canonical SPDX texts that must stay byte-exact.
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]
        exclude: ^LICENSES/
      - id: end-of-file-fixer
        name: fix end of files
        entry: end-of-file-fixer
        language: system
        types: [text]
        exclude: ^LICENSES/
      - id: check-yaml
        name: check yaml
        entry: check-yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: check toml
        entry: check-toml
        language: system
        types: [toml]
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: check-merge-conflict
        language: system
        types: [text]
      - id: check-added-large-files
        name: check for added large files
        entry: check-added-large-files
        language: system
      - id: debug-statements
        name: debug statements (python)
        entry: debug-statement-hook
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude
        language: system
        args: [--fix]
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true

      - id: reuse
        name: reuse lint
        entry: reuse
        language: system
        args: [lint]
        pass_filenames: false

      # Types and annotations, checked identically before commit and push.
      - id: pyrefly
        name: pyrefly
        entry: pyrefly check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
